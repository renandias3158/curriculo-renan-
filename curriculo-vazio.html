<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currículo</title>
  <style>
    :root {
      --ink: #182435;
      --muted: #dbe2ea;
      --accent: #54c6bd;
      --sidebar: #15283f;
      --paper: #ffffff;
      --canvas: #edf1f5;
    }

    * { box-sizing: border-box; }

    html { background: var(--canvas); }

    body {
      margin: 0;
      padding: 32px 16px;
      color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .resume {
      display: grid;
      grid-template-columns: 29% 71%;
      width: min(100%, 900px);
      min-height: 1120px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 18px 55px rgba(20, 37, 57, .14);
    }

    .sidebar {
      padding: 42px 27px;
      background: var(--sidebar);
      color: #fff;
    }

    .portrait {
      width: 126px;
      height: 126px;
      margin: 0 auto 52px;
      border: 2px solid rgba(84, 198, 189, .9);
      border-radius: 50%;
    }

    .main {
      padding: 46px 42px 48px;
    }

    .identity {
      min-height: 142px;
      margin-bottom: 24px;
      border-bottom: 3px solid var(--accent);
    }

    section { margin: 0 0 32px; }

    h2 {
      margin: 0 0 18px;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .sidebar h2 {
      color: var(--accent);
    }

    .main h2 {
      color: var(--ink);
    }

    .main h2::after {
      content: "";
      display: block;
      width: 38px;
      height: 3px;
      margin-top: 9px;
      background: var(--accent);
    }

    .blank-stack {
      display: grid;
      gap: 13px;
    }

    .blank-line {
      height: 8px;
      border-radius: 2px;
      background: var(--muted);
    }

    .sidebar .blank-line {
      background: rgba(255, 255, 255, .18);
    }

    .short { width: 56%; }
    .medium { width: 76%; }
    .long { width: 100%; }

    .entry {
      min-height: 73px;
      margin: 0 0 15px;
      padding: 0 0 16px;
      border-bottom: 1px solid #edf0f4;
    }

    .entry:last-child {
      margin-bottom: 0;
      border-bottom: 0;
    }

    .entry .blank-stack { gap: 11px; }

    .sidebar section { margin-bottom: 36px; }

    @media (max-width: 640px) {
      body { padding: 0; }
      .resume {
        grid-template-columns: 1fr;
        min-height: 100vh;
      }
      .sidebar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 24px;
        padding: 28px 24px;
      }
      .portrait {
        grid-column: 1 / -1;
        margin-bottom: 18px;
      }
      .sidebar section { margin-bottom: 18px; }
      .main { padding: 32px 24px; }
      .identity { min-height: 110px; }
    }

    @page {
      size: A4;
      margin: 0;
    }

    @media print {
      html, body {
        width: 210mm;
        min-height: 297mm;
        margin: 0;
        padding: 0;
        background: #fff;
      }
      .resume {
        width: 210mm;
        min-height: 297mm;
        margin: 0;
        box-shadow: none;
        break-inside: avoid;
      }
      .sidebar { padding: 14mm 7mm; }
      .main { padding: 15mm 11mm; }
      .portrait {
        width: 31mm;
        height: 31mm;
        margin-bottom: 13mm;
      }
      section { margin-bottom: 8mm; }
      .sidebar section { margin-bottom: 10mm; }
      .entry { min-height: 17mm; margin-bottom: 3mm; padding-bottom: 3mm; }
    }
  </style>
</head>
<body>
  <main class="resume">
    <aside class="sidebar">
      <div class="portrait" aria-hidden="true"></div>

      <section>
        <h2>Contato</h2>
        <div class="blank-stack" aria-hidden="true">
          <div class="blank-line long"></div>
          <div class="blank-line medium"></div>
          <div class="blank-line long"></div>
          <div class="blank-line short"></div>
        </div>
      </section>

      <section>
        <h2>Habilidades</h2>
        <div class="blank-stack" aria-hidden="true">
          <div class="blank-line long"></div>
          <div class="blank-line medium"></div>
          <div class="blank-line long"></div>
          <div class="blank-line short"></div>
          <div class="blank-line medium"></div>
        </div>
      </section>

      <section>
        <h2>Idiomas</h2>
        <div class="blank-stack" aria-hidden="true">
          <div class="blank-line long"></div>
          <div class="blank-line medium"></div>
          <div class="blank-line short"></div>
        </div>
      </section>
    </aside>

    <div class="main">
      <header class="identity" aria-label="Cabeçalho vazio"></header>

      <section>
        <h2>Objetivo profissional</h2>
        <div class="entry" aria-hidden="true"><div class="blank-stack"><div class="blank-line long"></div><div class="blank-line long"></div><div class="blank-line medium"></div></div></div>
      </section>

      <section>
        <h2>Formação acadêmica</h2>
        <div class="entry" aria-hidden="true"><div class="blank-stack"><div class="blank-line long"></div><div class="blank-line medium"></div><div class="blank-line short"></div></div></div>
        <div class="entry" aria-hidden="true"><div class="blank-stack"><div class="blank-line long"></div><div class="blank-line medium"></div></div></div>
      </section>

      <section>
        <h2>Experiência profissional</h2>
        <div class="entry" aria-hidden="true"><div class="blank-stack"><div class="blank-line long"></div><div class="blank-line long"></div><div class="blank-line medium"></div></div></div>
        <div class="entry" aria-hidden="true"><div class="blank-stack"><div class="blank-line long"></div><div class="blank-line medium"></div><div class="blank-line short"></div></div></div>
      </section>

      <section>
        <h2>Projetos</h2>
        <div class="entry" aria-hidden="true"><div class="blank-stack"><div class="blank-line long"></div><div class="blank-line medium"></div></div></div>
      </section>

      <section>
        <h2>Cursos complementares</h2>
        <div class="entry" aria-hidden="true"><div class="blank-stack"><div class="blank-line long"></div><div class="blank-line medium"></div></div></div>
      </section>
    </div>
  </main>
</body>
</html>
